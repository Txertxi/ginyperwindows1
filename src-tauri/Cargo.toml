[package]
name = "fwco-widget"
version = "1.0.0"
description = "Rellotge GMT i calendari de festius per a l'escriptori"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
